<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopper@10</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container" id="container">
        <div class="header-area">
            <div id="animationContainer" class="hidden">
                <iframe id="anim-win" src="https://lottie.host/embed/e5053127-0760-45ba-a8ee-d602e6ed96a6/Yqf7zf7rUJ.lottie"></iframe>
                <iframe id="anim-fast" src="https://lottie.host/embed/c58d720a-e228-439b-ada6-bb0c93a283c9/XU0eRyULrx.lottie"></iframe>
                <iframe id="anim-slow" src="https://lottie.host/embed/aec49c0a-6022-44ef-bef6-5b4a116ecf14/MxzjkHcYA7.lottie"></iframe>
                <iframe id="anim-close" src="https://lottie.host/embed/39c73cda-c074-4be7-9c56-a099f3666171/5Dvv94ot6Y.lottie"></iframe>
            </div>
            <div class="mission-label" id="missionLabel">Current Mission</div>
        </div>
        
        <h1 class="title">Stop b/w 9.8 and 10.2!</h1>

        <div class="timer-card">
            <div id="timer" class="timer-display">
                00.<span class="ms-suffix">000</span>
            </div>
            <div class="badge">Precision Mode</div>
        </div>

        <div id="message"></div>

        <button id="startBtn" class="action-btn">
            <div class="play-icon"></div>
            Start
        </button>

        <button id="resetBtn" class="action-btn hidden">
            Play Again
        </button>

        <script src="script.js"></script>
    </div>
</body>

</html>
